body:
  - type: markdown
    attributes:
      value: |
        Please search first. If someone already suggested it, a 👍 there helps more than a new post.

        可以用中文填写。
  - type: textarea
    id: use-case
    attributes:
      label: What are you trying to do, and what's in the way?
      description: Describing the situation helps more than describing a solution
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How you imagine it could work (optional)
  - type: dropdown
    id: servers
    attributes:
      label: Related servers (optional)
      multiple: true
      options:
        - All
        - Jellyfin
        - Emby
        - Navidrome
        - gonic
        - Other Subsonic-compatible server
