body:
  - type: markdown
    attributes:
      value: |
        ⚠️ This is public. Remove or blur **server addresses, usernames and `api_key` / `token` / `u` / `t` / `s` parameters** in screenshots and logs.

        可以用中文填写。
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Found in Settings → About
      placeholder: "1.0 (100)"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - iPhone
        - iPad
        - Mac
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "iOS 26.1 / macOS 26.1"
    validations:
      required: true
  - type: dropdown
    id: server
    attributes:
      label: Server type
      options:
        - Jellyfin
        - Emby
        - Navidrome
        - gonic
        - Other Subsonic-compatible server
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Server version
      placeholder: "10.11.0"
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you expected, and what actually happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I've removed server addresses and credentials from screenshots and logs
          required: true
